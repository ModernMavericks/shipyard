name: shipyard-cmake tree
description: >
  shipyard's own workflows only. Restore the universal CMake tree shipyard ships as shipyard-cmake, or
  build it on a cache miss: x86_64/10.9 (compat-guarded) and arm64/11.0 from Kitware's verified source,
  merged with lipo. Keyed on the pin and the scripts that build it, so a normal push restores it.

outputs:
  tree:
    description: Path of the universal CMake tree (bin/cmake, bin/ctest, bin/cpack, share/cmake-X.Y)
    value: ${{ steps.out.outputs.tree }}

runs:
  using: composite
  steps:
    - uses: actions/cache@v6
      id: cache
      with:
        path: ${{ runner.temp }}/shipyard-cmake-tree
        # THIS FILE is in the key too: the sysroot, the SDK symlink, the Rosetta install and the
        # build-cmake.sh invocation all live here, so a change to how the tree is built would
        # otherwise restore a tree built the old way and look like it worked.
        key: shipyard-cmake-${{ runner.os }}-${{ hashFiles('cmake.pin', 'mavericks-clang.pin', 'patches/cmake/**', 'scripts/build-cmake.sh', 'scripts/lipo-merge-tree.sh', '.github/actions/shipyard-cmake/action.yml') }}

    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -eu
        t="$RUNNER_TEMP"
        # x86_64 is the cross build on this arm64 runner; it is the slice the 10.9 box runs, so it is
        # the one the compat guard must pass -- checked THIN, before the merge.
        # The x86_64/10.9 half is compiled with the family's mavericks-clang (cross pkg: runs here, targets
        # 10.9), pinned in mavericks-clang.pin and verified against that release's SHA256SUMS.
        cv="$(sed -n 's/^MAVERICKS_CLANG_VERSION=//p' mavericks-clang.pin)"
        d="$t/mclang"; mkdir -p "$d"
        gh release download "$cv" -R ModernMavericks/clang --pattern 'mavericks-clang-*-cross-*.pkg' --pattern SHA256SUMS --dir "$d"
        ( cd "$d" && grep ' mavericks-clang-.*-cross-.*\.pkg$' SHA256SUMS | shasum -a 256 -c - )
        sudo installer -pkg "$d"/mavericks-clang-*-cross-*.pkg -target /
        # bootstrap compiles a stage-0 cmake and RUNS it. mavericks-clang always targets x86_64/10.9, so on
        # this arm64 runner that stage-0 is an x86_64 binary: without Rosetta it cannot run, and bootstrap
        # reports "Cannot find appropriate C compiler". mavericks-golang installs it the same way.
        softwareupdate --install-rosetta --agree-to-license \
          || { echo "::error::cannot install Rosetta; the x86_64/10.9 half's bootstrap cannot run its stage-0 here"; exit 1; }
        mc="$(ls -d /usr/local/mavericks-clang-*-cross | head -1)"
        # The pkg's payload installs an EMPTY SDKs/ scaffold (verified: `pkgutil --payload-files`
        # lists it as a bare directory, no children). The 10.9 SDK itself is fetched, cached under
        # $HOME/Library/Caches by default, and checksum-verified on demand by the toolchain's own
        # libexec/fetch_sdk.sh, which prints the SDK root on stdout -- it does not populate the
        # prefix's SDKs/ directory itself (see below).
        sdk="$("$mc/libexec/fetch_sdk.sh")"
        # bin/clang++.cfg (and clang.cfg) hardcode `-isysroot <CFGDIR>/../SDKs/MacOSX10.9.sdk` -- and
        # the pkg ships that SDKs/ directory EMPTY (fetch_sdk.sh only caches the SDK under
        # $HOME/Library/Caches/mavericks-sdk and prints its path; it never populates the prefix).
        # --sysroot only reaches build-cmake.sh's own CMake-level configure, not the raw compiler
        # invocations bootstrap's stage-0 makes -- those read the .cfg and get no headers at all.
        # Family convention: symlink the toolchain's SDKs entry at the fetched SDK (same as
        # mavericks-nodejs/build/fetch-toolchain.sh:51-56 and mavericks-clang/tests/smoke-target.sh:21-23).
        sudo mkdir -p "$mc/SDKs"
        sudo ln -sfn "$sdk" "$mc/SDKs/MacOSX10.9.sdk"
        CC="$mc/bin/clang" CXX="$mc/bin/clang++" \
          sh scripts/build-cmake.sh --arch x86_64 --min-os 10.9 --sysroot "$sdk" --prefix "$t/cmake-x86_64"
        sh scripts/assert_binary_compatible.sh "$t/cmake-x86_64/bin/cmake" "$t/cmake-x86_64/bin/ctest" "$t/cmake-x86_64/bin/cpack"
        sh scripts/build-cmake.sh --arch arm64 --min-os 11.0 --prefix "$t/cmake-arm64"
        sh scripts/lipo-merge-tree.sh --a "$t/cmake-x86_64" --b "$t/cmake-arm64" --out "$t/shipyard-cmake-tree" --require-archs "x86_64 arm64"

    - id: out
      shell: bash
      run: |
        set -eu
        tree="$RUNNER_TEMP/shipyard-cmake-tree"
        lipo -info "$tree/bin/cmake"
        "$tree/bin/cmake" --version | head -1
        echo "tree=$tree" >> "$GITHUB_OUTPUT"
