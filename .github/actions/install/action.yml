name: Install mavericks-shipyard
description: >
  Provide shipyard and shipyard-cmake to a job. A consumer references this action at the ref it pins
  (@v1 or @vX.Y.Z -- that ref IS the version) and gets exactly the pkg a developer installs: CI and dev
  boxes run the same bytes. Consumers configure with shipyard-cmake; MavericksShipyardConfig.cmake
  refuses any other cmake.

inputs:
  source:
    description: >
      'release' (default): install the released pkg this action's ref names. 'build': shipyard's own
      workflows only -- assemble shipyard-cmake from the cached CMake build plus this checkout.
    required: false
    default: release

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -eu
        [ "$(uname -s)" = Darwin ] || { echo "::error::shipyard has no Linux build yet; this action needs a macOS runner"; exit 1; }
        # bats BEFORE anything configures: shipyard's CMakeLists registers its shell tests only when
        # bats is present. From the platform package manager (checksummed), not a curl|sh.
        if command -v bats >/dev/null 2>&1; then echo "bats: $(command -v bats)"
        elif command -v brew >/dev/null 2>&1; then brew install bats-core && echo "bats: installed via brew"
        else echo "::warning::no bats and no package manager to install it; *.bats tests will be skipped"; fi

    # The consumer path. There is no `cmake --install` of a checkout here any more: a consumer gets the
    # pkg, the same artifact a developer double-clicks, so "it works in CI" and "it works on my box"
    # stop being two different installations. The ref IS the version pin.
    - if: inputs.source == 'release'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -eu
        root="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        ref='${{ github.action_ref }}'
        ver="$(sh "$root/scripts/resolve-action-version.sh" "$ref")" \
          || { echo "::error::'$ref' names no shipyard release -- pin ModernMavericks/shipyard/.github/actions/install@v1 (or an exact @vX.Y.Z)"; exit 1; }
        d="$RUNNER_TEMP/shipyard-pkg"; mkdir -p "$d"
        gh release download "v$ver" -R ModernMavericks/shipyard --pattern 'mavericks-shipyard-*.pkg' --dir "$d"
        sudo installer -pkg "$d"/mavericks-shipyard-*.pkg -target /
        /usr/local/bin/shipyard-cmake --version | head -1
        scripts=/usr/local/mavericks-shipyard/share/cmake/MavericksShipyard/scripts
        [ -d "$scripts" ] || { echo "::error::the shipyard pkg installed no scripts dir at $scripts"; exit 1; }
        echo "SHIPYARD_SCRIPTS=$scripts" >> "$GITHUB_ENV"
        echo "shipyard $ver installed; SHIPYARD_SCRIPTS=$scripts"

    # shipyard's own workflows only, and the reason this input exists: shipyard cannot install a
    # released shipyard to test the one it is about to release. `uses:` with a local path inside a
    # composite resolves against the WORKSPACE, which in those jobs is shipyard's own checkout.
    - if: inputs.source == 'build'
      id: cm
      uses: ./.github/actions/shipyard-cmake

    - if: inputs.source == 'build'
      shell: bash
      run: |
        set -eu
        # The prefix a developer's pkg would install, assembled from the cached CMake tree plus THIS
        # checkout -- so the config's refusal passes here for the same reason it does there: the
        # running cmake lives in a prefix that also holds a shipyard.
        tree='${{ steps.cm.outputs.tree }}'
        p="$RUNNER_TEMP/shipyard-prefix"; rm -rf "$p"; cp -R "$tree" "$p"
        "$p/bin/cmake" -S "$GITHUB_WORKSPACE" -B "$RUNNER_TEMP/shipyard-self-build" >/dev/null
        "$p/bin/cmake" --install "$RUNNER_TEMP/shipyard-self-build" --prefix "$p" >/dev/null
        # The three names the pkg puts on the default PATH, so a workflow step writes the same command
        # line it would write on a developer's box.
        b="$RUNNER_TEMP/shipyard-bin"; mkdir -p "$b"
        for c in cmake ctest cpack; do ln -sf "$p/bin/$c" "$b/shipyard-$c"; done
        echo "$b" >> "$GITHUB_PATH"
        # SHIPYARD_CMAKE_TREE is the UNTOUCHED tree, not "$p": package-pkg.sh refuses a --cmake-tree
        # holding anything outside bin/doc/man/share, and "$p" has shipyard installed into it.
        {
          echo "SHIPYARD_SCRIPTS=$p/share/cmake/MavericksShipyard/scripts"
          echo "SHIPYARD_CMAKE=$b/shipyard-cmake"
          echo "SHIPYARD_CMAKE_TREE=$tree"
        } >> "$GITHUB_ENV"
        "$b/shipyard-cmake" --version | head -1
