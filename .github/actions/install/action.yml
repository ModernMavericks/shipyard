name: Install mavericks-shipyard
description: >
  Configure + install mavericks-shipyard to a prefix so consumers find it via
  find_package() / the CMake user package registry. shipyard does its own
  installing -- a consumer just references this action at a pinned ref (that ref IS
  the version pin); it should NOT clone + `cmake --install` shipyard by hand.

inputs:
  prefix:
    description: Install prefix (self-registers in the user package registry). Default $HOME/.local.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -eu
        # This action is checked out at ${{ github.action_path }} = <repo>/.github/actions/install;
        # the repo root (with CMakeLists.txt) is three levels up.
        root="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        prefix="${{ inputs.prefix }}"; [ -n "$prefix" ] || prefix="$HOME/.local"

        # Ensure bats BEFORE configuring: shipyard's CMakeLists registers its shell-helper tests
        # only when bats is present ("bats not found -- shell helper tests won't run via ctest"), so
        # installing it afterwards would leave that first configure short of tests.
        # run-repo-tests.sh likewise reports SKIP for *.bats without it, which is honest but useless:
        # those assertions then run nowhere, the same hole that let two tests rot unnoticed.
        # Installed from the platform package manager (checksummed bottle/package), not a curl|sh.
        if command -v bats >/dev/null 2>&1; then
          echo "bats: $(command -v bats)"
        elif command -v brew >/dev/null 2>&1; then
          brew install bats-core && echo "bats: installed via brew"
        elif command -v apt-get >/dev/null 2>&1; then
          sudo apt-get update -qq && sudo apt-get install -y -qq bats && echo "bats: installed via apt"
        else
          echo "::warning::no bats and no package manager to install it; *.bats tests will be skipped"
        fi

        # Stamp the version before configuring. A used action is unpacked as a tarball with no .git,
        # so shipyard-version.sh cannot count commits here and CMake would fall back to the bare line
        # -- leaving every consumer with an installed shipyard that reports "1.0" and cannot be told
        # apart from any other. The ref the consumer pinned is the identity that survives the tarball.
        # Best-effort: an unresolvable ref (a raw SHA, a branch) still installs, just less precisely.
        if ver="$(sh "$root/scripts/resolve-action-version.sh" "${{ github.action_ref }}" 2>&1)"; then
          printf '%s\n' "$ver" > "$root/VERSION"
          echo "shipyard version: $ver (from ${{ github.action_ref }})"
        else
          echo "::warning::could not resolve a shipyard version from ref '${{ github.action_ref }}' ($ver); installing with the bare line"
        fi

        cmake -S "$root" -B "$RUNNER_TEMP/msc-build"
        cmake --install "$RUNNER_TEMP/msc-build" --prefix "$prefix"
        echo "installed mavericks-shipyard -> $prefix (registered in the CMake user package registry)"

        # Export the scripts dir so consumers stop re-deriving it. Every consumer previously repeated
        # SCR="$(cat "$HOME/.cmake/packages/MavericksShipyard/"* | head -1)/scripts" -- 11 copies
        # across the family. The action already knows where it installed, so it can just say so.
        # The registry lookup stays valid (it is what this reads), so adoption is per-repo, no flag day.
        scripts="$(cat "$HOME/.cmake/packages/MavericksShipyard/"* 2>/dev/null | head -1)/scripts"
        [ -d "$scripts" ] || scripts="$prefix/share/cmake/MavericksShipyard/scripts"
        [ -d "$scripts" ] || { echo "::error::cannot locate installed shipyard scripts dir"; exit 1; }
        echo "SHIPYARD_SCRIPTS=$scripts" >> "$GITHUB_ENV"
        echo "SHIPYARD_SCRIPTS=$scripts"

