name: Install mavericks-shipyard
description: >
  Provide shipyard and shipyard-cmake to a job. A consumer references this action at the ref it pins
  (@v1 or @vX.Y.Z -- that ref IS the version) and gets exactly the pkg a developer installs: CI and dev
  boxes run the same bytes. Consumers configure with shipyard-cmake; MavericksShipyardConfig.cmake
  refuses any other cmake.

inputs:
  source:
    description: >
      'release' (default): install the released pkg this action's ref names. 'build': shipyard's own
      workflows only -- assemble shipyard-cmake from the cached CMake build plus this checkout.
    required: false
    default: release
  cmake-tree:
    description: >
      source: build only. The universal CMake tree to assemble the prefix from -- the `tree` output of
      shipyard's own .github/actions/shipyard-cmake, which the CALLING WORKFLOW runs. This action must
      not run it itself: a `uses: ./...` inside a composite resolves against the CONSUMER's
      GITHUB_WORKSPACE, and nested actions are prepared before step `if:` conditions are evaluated, so
      every consumer would fail with "Can't find 'action.yml'" for a step that was never going to run
      -- and shipyard's own CI could never reproduce it, because its workspace does have that path
      (R-P1-19).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -eu
        # bats BEFORE anything configures: shipyard's CMakeLists registers its shell tests only when
        # bats is present. From the platform package manager (checksummed), not a curl|sh.
        if command -v bats >/dev/null 2>&1; then echo "bats: $(command -v bats)"
        elif command -v brew >/dev/null 2>&1; then brew install bats-core && echo "bats: installed via brew"
        elif command -v apt-get >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq bats && echo "bats: installed via apt"
        else echo "::warning::no bats and no package manager to install it; *.bats tests will be skipped"; fi

    # source: build compiles the universal CMake from source against an Apple toolchain. That is the
    # ONE thing this action cannot do elsewhere, so it is the only thing that refuses a non-macOS
    # runner -- and it is shipyard's own workflows, which choose their runner.
    - if: inputs.source == 'build' && runner.os != 'macOS'
      shell: bash
      run: |
        set -eu
        echo "::error::source: build needs a macOS runner -- it builds the universal CMake from Kitware's source against an Apple toolchain. Consumers want the default (source: release)."
        exit 1

    # The consumer path. There is no `cmake --install` of a checkout here any more: a consumer gets the
    # pkg, the same artifact a developer double-clicks, so "it works in CI" and "it works on my box"
    # stop being two different installations. The ref IS the version pin.
    - if: inputs.source == 'release' && runner.os == 'macOS'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -eu
        root="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        ref='${{ github.action_ref }}'
        ver="$(sh "$root/scripts/resolve-action-version.sh" "$ref")" \
          || { echo "::error::'$ref' names no shipyard release -- pin ModernMavericks/shipyard/.github/actions/install@v1 (or an exact @vX.Y.Z)"; exit 1; }
        d="$RUNNER_TEMP/shipyard-pkg"; mkdir -p "$d"
        gh release download "v$ver" -R ModernMavericks/shipyard --pattern 'mavericks-shipyard-*.pkg' --dir "$d"
        sudo installer -pkg "$d"/mavericks-shipyard-*.pkg -target /
        /usr/local/bin/shipyard-cmake --version | head -1
        scripts=/usr/local/mavericks-shipyard/share/cmake/MavericksShipyard/scripts
        [ -d "$scripts" ] || { echo "::error::the shipyard pkg installed no scripts dir at $scripts"; exit 1; }
        echo "SHIPYARD_SCRIPTS=$scripts" >> "$GITHUB_ENV"
        echo "shipyard $ver installed; SHIPYARD_SCRIPTS=$scripts"

    # R-P1-18. There is no Linux pkg, and the jobs that land here do not want one: they run shipyard's
    # SHELL half (repackage-decision.sh and friends) on ubuntu-latest, where the whole point is that
    # the job is cheap. Refusing them would have broken every consumer of
    # repackage-on-ingredient-bump.yml on the day this action started installing a pkg.
    #
    # The scripts come from the action's OWN checkout -- <action_path>/../../.. is shipyard at the ref
    # the consumer pinned, the same path the macOS branch resolves resolve-action-version.sh from -- so
    # the shell half is still version-pinned, just not packaged.
    - if: inputs.source == 'release' && runner.os != 'macOS'
      shell: bash
      run: |
        set -eu
        root="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        scripts="$root/scripts"
        # Named, not just tested for existence: if the action's layout ever moves, this must say which
        # path it tried rather than export a plausible-looking directory that holds nothing.
        [ -f "$scripts/run-repo-tests.sh" ] || {
          echo "::error::$scripts does not look like shipyard's scripts dir (no run-repo-tests.sh) -- the action's own checkout is not where this expected it"; exit 1; }
        # find_package(MavericksShipyard) must resolve here too: container-tools' two ubuntu-latest
        # jobs do exactly that, to reach the scripts. MavericksShipyard_DIR and not CMAKE_PREFIX_PATH
        # (both work; so does MavericksShipyard_ROOT): it is package-scoped and EXACT -- "this is the
        # config directory", no search -- so it can neither mis-resolve nor shadow another package the
        # way putting a whole checkout on CMAKE_PREFIX_PATH could. The checkout root is where
        # MavericksShipyardConfig.cmake lives in a source tree. The config skips its shipyard-cmake
        # refusal when the HOST is not Apple, so this resolves rather than being rejected (R-P1-23).
        [ -f "$root/MavericksShipyardConfig.cmake" ] || {
          echo "::error::$root holds no MavericksShipyardConfig.cmake -- find_package(MavericksShipyard) would not resolve on this runner"; exit 1; }
        {
          echo "SHIPYARD_SCRIPTS=$scripts"
          echo "MavericksShipyard_DIR=$root"
        } >> "$GITHUB_ENV"
        echo "${RUNNER_OS:-this runner} is not macOS and shipyard has no Linux pkg yet, so nothing was installed. You get shipyard's shell half from the ref you pinned: SHIPYARD_SCRIPTS=$scripts, and find_package(MavericksShipyard) resolves via MavericksShipyard_DIR=$root. There is no shipyard-cmake here, so a configure that needs one must run on a macOS runner."

    # shipyard's own workflows only, and the reason this input exists: shipyard cannot install a
    # released shipyard to test the one it is about to release.
    #
    # THIS ACTION MUST CONTAIN NO `uses: ./...`. GitHub resolves a local action path inside a
    # composite against GITHUB_WORKSPACE -- the CONSUMER's checkout, which has no
    # .github/actions/shipyard-cmake -- and it prepares nested actions BEFORE evaluating step `if:`
    # conditions, so `source: build` being false would not spare them: every consumer's job would die
    # with "Can't find 'action.yml'". shipyard's own CI cannot reproduce that, because its workspace
    # is shipyard. So the caller runs the composite and passes its output in (R-P1-19).
    - if: inputs.source == 'build'
      shell: bash
      run: |
        set -eu
        # The prefix a developer's pkg would install, assembled from the cached CMake tree plus THIS
        # checkout -- so the config's refusal passes here for the same reason it does there: the
        # running cmake lives in a prefix that also holds a shipyard.
        tree='${{ inputs.cmake-tree }}'
        [ -n "$tree" ] || {
          echo "::error::source: build needs cmake-tree -- run shipyard's .github/actions/shipyard-cmake in the calling workflow and pass its 'tree' output in. (This action cannot run it: see the comment above this step.)"; exit 1; }
        [ -x "$tree/bin/cmake" ] || { echo "::error::cmake-tree has no bin/cmake: $tree"; exit 1; }
        p="$RUNNER_TEMP/shipyard-prefix"; rm -rf "$p"; cp -R "$tree" "$p"
        "$p/bin/cmake" -S "$GITHUB_WORKSPACE" -B "$RUNNER_TEMP/shipyard-self-build" >/dev/null
        "$p/bin/cmake" --install "$RUNNER_TEMP/shipyard-self-build" --prefix "$p" >/dev/null
        # The three names the pkg puts on the default PATH, so a workflow step writes the same command
        # line it would write on a developer's box.
        b="$RUNNER_TEMP/shipyard-bin"; mkdir -p "$b"
        for c in cmake ctest cpack; do ln -sf "$p/bin/$c" "$b/shipyard-$c"; done
        echo "$b" >> "$GITHUB_PATH"
        # SHIPYARD_CMAKE_TREE is the UNTOUCHED tree, not "$p": package-pkg.sh refuses a --cmake-tree
        # holding anything outside bin/doc/man/share, and "$p" has shipyard installed into it.
        {
          echo "SHIPYARD_SCRIPTS=$p/share/cmake/MavericksShipyard/scripts"
          echo "SHIPYARD_CMAKE=$b/shipyard-cmake"
          echo "SHIPYARD_CMAKE_TREE=$tree"
        } >> "$GITHUB_ENV"
        "$b/shipyard-cmake" --version | head -1
