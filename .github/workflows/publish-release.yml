name: publish-release

# Reusable: the one way the family publishes. The caller hands over a version and the artifact holding
# its assets plus RELEASE_NOTES.md; this downloads them, regenerates SHA256SUMS, and creates or updates
# the release with those notes as its body.
#
# It owns checksums and the body on purpose. Both were per-repo before, and both were silently omitted:
# tailscale published an empty Release body on EVERY release (including hand-tagged ones that had a
# committed notes file), and swift-runtime set no body at all.
#
# action-gh-release, not `gh release create`: tag_name + target_commitish mint the tag inline, which
# the dispatch-cut repos require -- a GITHUB_TOKEN-pushed tag triggers nothing.

on:
  workflow_call:
    inputs:
      version:
        description: "Release version; also the tag name."
        type: string
        required: true
      artifact:
        description: "Artifact holding the assets and the notes file."
        type: string
        required: true
      notes-file:
        description: "Notes file within the artifact; becomes the Release body."
        type: string
        required: false
        default: RELEASE_NOTES.md
      target-commitish:
        description: "Commit the tag is minted at. Defaults to the caller's SHA."
        type: string
        required: false
        default: ""
      checksums:
        description: "Generate SHA256SUMS over the assets."
        type: boolean
        required: false
        default: true
      shipyard-ref:
        description: "shipyard ref to take release-assets.sh from."
        type: string
        required: false
        default: v1

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out shipyard (for release-assets.sh)
        uses: actions/checkout@v7
        with:
          repository: ModernMavericks/shipyard
          ref: ${{ inputs.shipyard-ref }}
          path: .shipyard

      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
          path: dist

      # A signed release must come with scan-for-key.yml's record that this run's logs and files were
      # scanned for the signing key. That scan runs in the caller's own job (it needs actions: read,
      # which this workflow may not ask for); this is where its absence shows, for every product.
      # By pattern, not name: a name that matches nothing fails the step (and paints a red
      # annotation on a green run); a pattern that matches nothing downloads nothing, and
      # require_key_scan.sh decides whether that is acceptable.
      - name: Look for the signing-key scan
        uses: actions/download-artifact@v8
        with:
          pattern: sparkle-key-scan
          merge-multiple: true
          path: .keyscan

      - name: A signed release must have been scanned for the signing key
        run: sh .shipyard/scripts/require_key_scan.sh dist .keyscan

      - name: Select assets, verify the notes, checksum
        id: assets
        env:
          NOTES: ${{ inputs.notes-file }}
          CHECKSUMS: ${{ inputs.checksums }}
        run: |
          set -eu
          # Fails loudly when the notes are missing or empty -- publishing is where the notes promise
          # is kept, so an empty body stops the release rather than shipping quietly.
          files="$(sh .shipyard/scripts/release-assets.sh dist "$NOTES")"
          if [ "$CHECKSUMS" = true ]; then
            ( cd dist && printf '%s\n' "$files" | sed 's|^dist/||' | xargs shasum -a 256 > SHA256SUMS )
            # Verify what we just wrote. Generating a checksum file and publishing it unread means the
            # one artifact nobody can check by eye is the one nobody checked at all -- and a truncated
            # or partial write looks exactly like a valid file until someone downloads it.
            ( cd dist && shasum -a 256 -c SHA256SUMS ) \
              || { echo "::error::SHA256SUMS does not verify against the files it names"; exit 1; }
            # ...and it must cover exactly the assets being attached: an entry for a file we are not
            # publishing, or an asset with no entry, is a checksum file that lies by omission.
            want="$(printf '%s\n' "$files" | sed 's|^dist/||' | sort)"
            got="$(sed 's/^[0-9a-f]*  //' dist/SHA256SUMS | sort)"
            [ "$want" = "$got" ] \
              || { echo "::error::SHA256SUMS covers $got; the assets are $want"; exit 1; }
            files="$files
          dist/SHA256SUMS"
          fi
          echo "=== assets ==="; printf '%s\n' "$files"
          echo "=== body ==="; cat "dist/$NOTES"
          { echo 'files<<EOF'; printf '%s\n' "$files"; echo 'EOF'; } >> "$GITHUB_OUTPUT"

      - name: Refuse an already-taken tag
        env:
          VER: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          # Two dispatches can now run concurrently (each is alone in its concurrency group), so both
          # can compute the same -mavericks.(N+1) from the same tag set. The loser must NOT relabel:
          # $VER is already baked into pkgbuild --version, the pkg filename and the appcast's
          # <sparkle:version>, which assert_appcast_upgradeable.sh compares against the tag history.
          # Publishing these artifacts under a different tag would ship a release whose contents
          # contradict its name. Rebuilding is the only correct fix, and that is a re-dispatch.
          #
          # Ask the CALLER's remote by URL, not `origin`: this job checks shipyard out into
          # .shipyard/ and never checks out the calling repo, so there is no origin here to ask --
          # and a guard that errors out is a guard that passes everything. Hence the three-way
          # case: 0 = the tag is taken, 2 = --exit-code found no such ref, anything else = the
          # query itself failed and we must not publish blind. Every family repo is public, so
          # this needs no token.
          set +e
          git ls-remote --exit-code --tags "https://github.com/$REPO" "refs/tags/$VER" >/dev/null 2>&1
          rc=$?
          set -e
          case "$rc" in
            0)
              echo "::error::tag $VER already exists -- another run published it while this one was building."
              echo "::error::Nothing was published. Re-dispatch this release: it will compute the next -mavericks.N and rebuild with that version baked in."
              exit 1
              ;;
            2) echo "tag $VER is free" ;;
            *)
              echo "::error::could not read tags from https://github.com/$REPO (git ls-remote exit $rc) -- refusing to publish without knowing whether $VER is taken."
              exit 1
              ;;
          esac

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ inputs.target-commitish || github.sha }}
          body_path: dist/${{ inputs.notes-file }}
          files: ${{ steps.assets.outputs.files }}
