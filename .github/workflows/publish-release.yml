name: publish-release

# Reusable: the one way the family publishes. The caller hands over a version and the artifact holding
# its assets plus RELEASE_NOTES.md; this downloads them, regenerates SHA256SUMS, and creates or updates
# the release with those notes as its body.
#
# It owns checksums and the body on purpose. Both were per-repo before, and both were silently omitted:
# tailscale published an empty Release body on EVERY release (including hand-tagged ones that had a
# committed notes file), and swift-runtime set no body at all.
#
# action-gh-release, not `gh release create`: tag_name + target_commitish mint the tag inline, which
# the dispatch-cut repos require -- a GITHUB_TOKEN-pushed tag triggers nothing.

on:
  workflow_call:
    inputs:
      version:
        description: "Release version; also the tag name."
        type: string
        required: true
      artifact:
        description: "Artifact holding the assets and the notes file."
        type: string
        required: true
      notes-file:
        description: "Notes file within the artifact; becomes the Release body."
        type: string
        required: false
        default: RELEASE_NOTES.md
      target-commitish:
        description: "Commit the tag is minted at. Defaults to the caller's SHA."
        type: string
        required: false
        default: ""
      checksums:
        description: "Generate SHA256SUMS over the assets."
        type: boolean
        required: false
        default: true
      shipyard-ref:
        description: "shipyard ref to take release-assets.sh from."
        type: string
        required: false
        default: v1

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out shipyard (for release-assets.sh)
        uses: actions/checkout@v7
        with:
          repository: ModernMavericks/shipyard
          ref: ${{ inputs.shipyard-ref }}
          path: .shipyard

      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
          path: dist

      # A signed release must come with scan-for-key.yml's record that this run's logs and files were
      # scanned for the signing key. That scan runs in the caller's own job (it needs actions: read,
      # which this workflow may not ask for); this is where its absence shows, for every product.
      # By pattern, not name: a name that matches nothing fails the step (and paints a red
      # annotation on a green run); a pattern that matches nothing downloads nothing, and
      # require_key_scan.sh decides whether that is acceptable.
      - name: Look for the signing-key scan
        uses: actions/download-artifact@v8
        with:
          pattern: sparkle-key-scan
          merge-multiple: true
          path: .keyscan

      - name: A signed release must have been scanned for the signing key
        run: sh .shipyard/scripts/require_key_scan.sh dist .keyscan

      - name: Select assets, verify the notes, checksum
        id: assets
        env:
          NOTES: ${{ inputs.notes-file }}
          CHECKSUMS: ${{ inputs.checksums }}
        run: |
          set -eu
          # Fails loudly when the notes are missing or empty -- publishing is where the notes promise
          # is kept, so an empty body stops the release rather than shipping quietly.
          files="$(sh .shipyard/scripts/release-assets.sh dist "$NOTES")"
          if [ "$CHECKSUMS" = true ]; then
            ( cd dist && printf '%s\n' "$files" | sed 's|^dist/||' | xargs shasum -a 256 > SHA256SUMS )
            # Verify what we just wrote. Generating a checksum file and publishing it unread means the
            # one artifact nobody can check by eye is the one nobody checked at all -- and a truncated
            # or partial write looks exactly like a valid file until someone downloads it.
            ( cd dist && shasum -a 256 -c SHA256SUMS ) \
              || { echo "::error::SHA256SUMS does not verify against the files it names"; exit 1; }
            # ...and it must cover exactly the assets being attached: an entry for a file we are not
            # publishing, or an asset with no entry, is a checksum file that lies by omission.
            want="$(printf '%s\n' "$files" | sed 's|^dist/||' | sort)"
            got="$(sed 's/^[0-9a-f]*  //' dist/SHA256SUMS | sort)"
            [ "$want" = "$got" ] \
              || { echo "::error::SHA256SUMS covers $got; the assets are $want"; exit 1; }
            files="$files
          dist/SHA256SUMS"
          fi
          echo "=== assets ==="; printf '%s\n' "$files"
          echo "=== body ==="; cat "dist/$NOTES"
          { echo 'files<<EOF'; printf '%s\n' "$files"; echo 'EOF'; } >> "$GITHUB_OUTPUT"

      # May this release be created, or is its tag already taken? The one allowed collision is a run
      # TRIGGERED BY its own pushed tag -- which always finds that tag, because the tag started it.
      # Refusing that left every tag-published repo unable to release (clang had no other path).
      - name: Refuse an already-taken tag
        env:
          VER: ${{ inputs.version }}
          REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          sh .shipyard/scripts/assert_tag_publishable.sh \
            "$VER" "https://github.com/$REPO" "$REF_TYPE" "$REF_NAME" "$SHA"

      # Up to three attempts, each from a clean slate. action-gh-release creates the release as a DRAFT,
      # uploads, and only then publishes it -- which is when the tag is minted -- and it does not retry a
      # failed upload. So one dropped connection stranded a draft with no tag: golang's
      # 1.26.8-mavericks.3 lost its native .pkg to "other side closed", and nothing downstream could see
      # it, because to a tag-reading world it did not exist. Between attempts every draft of THIS tag is
      # deleted (delete-draft-release.sh touches nothing published and nothing of another tag), and if
      # the last attempt fails too, the draft goes with it and the error says what to do.
      - name: A first release needs a README a human has read
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.target-commitish || github.sha }}
        run: |
          set -eu
          # Only the FIRST release is gated: a repo that has published before has a README somebody
          # shipped. "Has published before" is read as "has any tag", using the same trick as the
          # step above -- ask the caller's remote by URL. This job checks out shipyard, never the
          # calling repo, so there is no origin here and no working tree to inspect. Every family
          # repo is public, so this needs no token.
          if [ -n "$(git ls-remote --tags "https://github.com/$REPO" 2>/dev/null | head -n 1)" ]; then
            echo "$REPO has released before -- the first-release README gate does not apply"
            exit 0
          fi
          # Fetch the README AT THE COMMIT BEING RELEASED, not at the default branch's head: the
          # release is cut from target_commitish, and that is the README the release will be read
          # beside. A missing README is the script's to refuse, so an empty fetch still runs it.
          url="https://raw.githubusercontent.com/$REPO/$SHA/README.md"
          if curl -fsSL "$url" -o first-release-readme.md; then
            :
          else
            echo "::error::could not fetch $url -- refusing to publish a first release without seeing its README."
            exit 1
          fi
          sh .shipyard/scripts/check-readme-reviewed.sh first-release-readme.md

      - name: Publish
        id: publish1
        continue-on-error: true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ inputs.target-commitish || github.sha }}
          body_path: dist/${{ inputs.notes-file }}
          files: ${{ steps.assets.outputs.files }}

      - name: Publish failed -- clear its draft before retrying
        if: steps.publish1.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VER: ${{ inputs.version }}
        run: |
          echo "::warning::publishing $VER failed (attempt 1 of 3); retrying from a clean slate in 30s"
          sh .shipyard/scripts/delete-draft-release.sh "$REPO" "$VER"
          sleep 30

      - name: Publish (attempt 2)
        id: publish2
        if: steps.publish1.outcome == 'failure'
        continue-on-error: true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ inputs.target-commitish || github.sha }}
          body_path: dist/${{ inputs.notes-file }}
          files: ${{ steps.assets.outputs.files }}

      - name: Publish failed again -- clear its draft before the last attempt
        if: steps.publish2.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VER: ${{ inputs.version }}
        run: |
          echo "::warning::publishing $VER failed (attempt 2 of 3); last attempt in 90s"
          sh .shipyard/scripts/delete-draft-release.sh "$REPO" "$VER"
          sleep 90

      - name: Publish (attempt 3)
        id: publish3
        if: steps.publish2.outcome == 'failure'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ inputs.target-commitish || github.sha }}
          body_path: dist/${{ inputs.notes-file }}
          files: ${{ steps.assets.outputs.files }}

      - name: Nothing was published -- remove the draft
        # Keyed on attempt 1, not attempt 3: a cleanup step that fails between attempts skips the rest,
        # and must still not leave its draft behind.
        if: failure() && steps.publish1.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VER: ${{ inputs.version }}
        run: |
          sh .shipyard/scripts/delete-draft-release.sh "$REPO" "$VER"
          echo "::error::publishing $VER failed after retrying; its draft is deleted and no tag was minted, so nothing was published."
          echo "::error::Re-run this run's failed jobs to publish the same build. If the caller's main has moved since this run started (a workflow change makes the tag 403), re-dispatch instead."
          exit 1
