name: Reconcile release state

# The backstop. An event-driven release has exactly one chance to happen: golang's one real
# new-upstream release was silently lost to concurrency eviction and recovered by hand. A DECLARED
# state that has not been realised stays visible, and this notices it.
#
# Deliberately cheap. It runs on ubuntu and does one thing -- render main's declared state, ask
# whether a release carries that digest, and only if none does, dispatch the repo's real release
# workflow. A quiet night is one API call per repo. A scheduled job that BUILT each product to check
# it would be fourteen macOS builds a night, which is why this one never builds anything.
#
# Idempotent by construction: the dispatched run recomputes the same digest and stops if the release
# turned up in between, so racing a push-triggered run cannot double-publish.

on:
  workflow_call:
    inputs:
      release-workflow:
        description: "The release workflow to dispatch when a declared state has no release."
        type: string
        required: false
        default: "release.yml"
      dispatch-field:
        description: "A -f key=value passed to the dispatched workflow to request a publish."
        type: string
        required: false
        default: "local_release=true"
      upstream-file:
        description: >-
          Repo-relative path to the upstream version file, when it is not UPSTREAM_VERSION
          (container-tools and tailscale: components/<name>/version; golang:
          lines/126/UPSTREAM_VERSION). Sets $MAVERICKS_UPSTREAM_FILE for the state step, which BOTH
          scripts there read: version.sh derives the version from it, and release-state.sh refuses
          (exit 2) to render a declared `upstream` that is not the file version.sh reads. Without
          this input such a repo cannot use this workflow at all -- it would hard-fail nightly on
          the first run after adopting it.
        type: string
        required: false
        default: ""

permissions:
  contents: read          # check out main, and read published releases. NOT write: this workflow
                          # deliberately never edits a release body. It used to backfill a digest
                          # onto a release inferred-to-be-this-state from a version match, and that
                          # inference was unsound -- version.sh's `auto` mode maps every declared
                          # state of one upstream to one version, so the backfill could cement an
                          # UNRELEASED state onto a release that did not contain it and no later
                          # reconcile would ever look again. Marking a pre-migration release is now a
                          # one-time migration step a human runs, with the digest computed exactly
                          # from that tag's own tree (`release-state.sh --ref <tag>`).
  actions: write          # dispatching the release run -- without it this fails as silently as the
                          # lost release it exists to catch

concurrency:
  group: reconcile-${{ github.repository }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main           # main is where state is DECLARED; a branch is only a proposal
          fetch-depth: 0      # version.sh reads tags

      # shipyard's scripts at the ref this caller pinned -- the same bytes its release path uses.
      - uses: ModernMavericks/shipyard/.github/actions/install@v1

      # Both scripts below read $MAVERICKS_UPSTREAM_FILE, and they must agree about it: the digest
      # tracks the declared `upstream` file, the version is derived from this one, and a product
      # whose upstream is not UPSTREAM_VERSION has to say so in BOTH places it renders state -- here
      # as well as wherever it calls version.sh. Empty is the default and means UPSTREAM_VERSION,
      # because both readers use ${MAVERICKS_UPSTREAM_FILE:-...}.
      - id: state
        env:
          MAVERICKS_UPSTREAM_FILE: ${{ inputs.upstream-file }}
        run: |
          set -eu
          digest="$(sh "$SHIPYARD_SCRIPTS/release-state.sh")"
          version="$(sh "$SHIPYARD_SCRIPTS/version.sh" auto | sed -n 's/^FULL=//p')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "declared state: $digest (would publish $version)"

      - id: needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          answer="$(sh "$SHIPYARD_SCRIPTS/release-needed.sh" \
            --digest '${{ steps.state.outputs.digest }}' \
            --version '${{ steps.state.outputs.version }}' \
            --repo '${{ github.repository }}')"
          echo "$answer"
          echo "answer=$answer" >> "$GITHUB_OUTPUT"
          # A marker nothing here can read blocks publishing on purpose (see release-needed.sh), so
          # say so loudly: "nothing to do" and "nothing can be done" must not look the same in a log
          # nobody reads on a quiet night.
          case "$answer" in
            SKIP=unreadable-marker/*)
              echo "::warning::$answer -- recompute that release's digest from its own tree" \
                   "(release-state.sh --ref <tag>), then re-record it: release-state-record.sh" \
                   "--tag <tag> --digest <that> --replace-unreadable. That flag is REQUIRED --" \
                   "without it the re-record exits 3, because a marker already being present is" \
                   "the very thing that blocked publishing. Nothing publishes until then." ;;
          esac

      - name: Dispatch the release run
        if: startsWith(steps.needed.outputs.answer, 'PUBLISH')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          echo "::notice::no release realises ${{ steps.state.outputs.digest }}; dispatching ${{ inputs.release-workflow }}"
          gh workflow run '${{ inputs.release-workflow }}' --ref main -f '${{ inputs.dispatch-field }}'
