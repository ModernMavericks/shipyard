name: concurrency-probe
on:
  workflow_dispatch:
  push:
    branches: [concurrency-probe]

concurrency:
  group: probe-${{ github.event_name == 'push' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  sleep:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "event=${{ github.event_name }} group=probe-${{ github.event_name == 'push' && github.ref || github.sha }}"
          sleep 120
