name: repackage-on-ingredient-bump

# Reusable: a consumer calls this on push to main (filtered to its ingredient pin paths). If an
# ingredient pin changed and the repo's own upstream did NOT, DISPATCH the consumer's release
# workflow — workflow_dispatch IS triggerable by GITHUB_TOKEN, unlike a pushed tag — with
# local_release=true, so the consumer computes -mavericks.(N+1) and publishes inline. New-upstream
# (N=1) stays the repo's own job.

on:
  workflow_call:
    inputs:
      own-upstream-paths:
        description: "Newline/space-separated pin paths whose change means a NEW own upstream (N=1) — skipped here."
        type: string
        required: false
        default: ""
      dispatch-workflow:
        description: "The consumer release workflow to dispatch."
        type: string
        required: false
        default: "release.yml"
      dispatch-field:
        description: "A -f key=value passed to the dispatched workflow to request a repackage."
        type: string
        required: false
        default: "local_release=true"

concurrency:
  group: release-on-bump
  cancel-in-progress: false

jobs:
  repackage:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - name: Install mavericks-shipyard (for scripts/repackage-decision.sh)
        uses: ModernMavericks/shipyard/.github/actions/install@v1

      - name: Dispatch a repackage if a build ingredient (not own-upstream) moved
        env:
          GH_TOKEN: ${{ github.token }}
          OWN_UPSTREAM_PATHS: ${{ inputs.own-upstream-paths }}
          BEFORE: ${{ github.event.before }}
          DISPATCH_WORKFLOW: ${{ inputs.dispatch-workflow }}
          DISPATCH_FIELD: ${{ inputs.dispatch-field }}
        run: |
          set -eu
          SCR="$(cat "$HOME/.cmake/packages/MavericksShipyard/"* | head -1)/scripts"
          before="$BEFORE"; case "$before" in ''|0000000000000000000000000000000000000000) before="HEAD~1";; esac
          CHANGED="$(git diff --name-only "$before" HEAD)"; export CHANGED
          # The RESOLVED rev, not the raw event field: a path:KEY entry needs to read the file as it
          # was, and github.event.before is all-zeros on a first push.
          BEFORE="$before"; export BEFORE
          out="$(sh "$SCR/repackage-decision.sh")"
          echo "decision: $out"
          case "$out" in SKIP=*) exit 0;; esac
          echo "dispatching $DISPATCH_WORKFLOW on main with -f $DISPATCH_FIELD (consumer cuts+publishes the repackage inline)"
          gh workflow run "$DISPATCH_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref main -f "$DISPATCH_FIELD"
