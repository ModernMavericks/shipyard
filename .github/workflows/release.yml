name: release

# shipyard is consumed through a MOVING tag: fifteen repos pin @v1, and every push to main reaches
# them within minutes. Until now nothing recorded WHICH shipyard that was -- UPSTREAM_VERSION sat at
# 1.0.5 across 13 content changes, so an install could not be told apart from a month-old one, and a
# bad @v1 could not be pinned away from. Every push therefore cuts a version now.
#
# tag.yml used to own the tags. It is gone: one workflow owns both the immutable vX.Y.Z tag and the
# moving @vX, so the two cannot disagree about what @v1 points at.

on:
  push:
    branches: [main]

permissions:
  contents: write

# A run that can publish is alone in its group and is cancelled by nothing (conventions check 1b).
# Here EVERY push publishes, so there is no cancellable half but pull_request.
concurrency:
  group: >-
    release-${{ github.event_name == 'pull_request'
                && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-26   # the CMake modules gate on Apple clang; Linux cannot exercise them
    timeout-minutes: 30
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # shipyard-version.sh counts commits

      - name: Install mavericks-shipyard (self)
        uses: ./.github/actions/install

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Provision PyYAML (the workflow-parse gate's only dependency)
        run: python3 -m pip install --quiet pyyaml

      - name: Resolve the version
        id: ver
        run: |
          set -eu
          out="$(sh scripts/shipyard-version.sh)"
          ver="$(printf '%s\n' "$out" | sed -n 's/^FULL=//p')"
          printf '%s\n' "$ver" > VERSION      # a build product; gitignored, read by CMakeLists
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "shipyard $ver"

      - name: ctest (parameterized suites)
        run: |
          cmake -S . -B "$RUNNER_TEMP/build"
          ctest --test-dir "$RUNNER_TEMP/build" --output-on-failure

      - name: Standalone test suites
        run: sh scripts/run-repo-tests.sh

      # shipyard must satisfy every convention it exports. It could not before: with no release.yml
      # the gate exited early here, which is how check 7d's defect stayed invisible in the one repo
      # whose files contain example `cmake ... -B` command lines.
      - name: Our own conventions gate
        run: sh scripts/check-family-conventions.sh

      # The release asset is a pkg that installs the payload on either kind of box and keeps itself
      # current. There is no tarball: nothing consumed it, and GitHub attaches source archives to
      # every tag for free.
      - name: Build both updater slices
        run: |
          set -eu
          # Two configures, not two targets: CMAKE_OSX_ARCHITECTURES and the deployment target are
          # directory-scoped, and arm64 has no 10.9. Same shape as mavericks-golang's updater and
          # updater-cross. This runner is arm64, so x86_64/10.9 is the cross build here -- it is still
          # the "native" slice in the pkg's sense: the one that runs on the 10.9 box.
          # /usr/bin/clang, as every family updater build pins: the Apple toolchain, whatever else the
          # runner image puts on PATH.
          cmake -S . -B "$RUNNER_TEMP/upd-native" -DSHIPYARD_BUILD_UPDATER=ON \
            -DMAVERICKS_ALLOW_GENERIC_ICON=ON -DCMAKE_OBJC_COMPILER=/usr/bin/clang \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=10.9
          cmake --build "$RUNNER_TEMP/upd-native"
          cmake -S . -B "$RUNNER_TEMP/upd-cross" -DSHIPYARD_BUILD_UPDATER=ON \
            -DMAVERICKS_ALLOW_GENERIC_ICON=ON -DCMAKE_OBJC_COMPILER=/usr/bin/clang \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build "$RUNNER_TEMP/upd-cross"

      - name: Package
        run: |
          set -eu
          v='${{ steps.ver.outputs.version }}'
          mkdir -p dist
          # The payload is `cmake --install`'s layout, from its own configure: MAVERICKS_NO_USER_REGISTRY
          # keeps this install from re-pointing the runner's registry (the self-install step above set
          # it) at a staging prefix. The pkg's postinstall registers the INSTALLED payload instead.
          cmake -S . -B "$RUNNER_TEMP/payload-build" -DMAVERICKS_NO_USER_REGISTRY=ON
          cmake --install "$RUNNER_TEMP/payload-build" --prefix "$RUNNER_TEMP/payload-prefix"
          sh scripts/package-pkg.sh \
            --payload "$RUNNER_TEMP/payload-prefix/share/cmake/MavericksShipyard" \
            --app-native "$RUNNER_TEMP/upd-native/MavericksShipyardUpdater.app" \
            --app-cross  "$RUNNER_TEMP/upd-cross/MavericksShipyardCrossUpdater.app" \
            --version "$v" \
            --out "dist/mavericks-shipyard-$v.pkg"
          # What the installer will DO on a box that has the previous version: no relocation to a
          # locally built updater, no skipped overwrite.
          sh scripts/assert_pkg_installs_in_place.sh "dist/mavericks-shipyard-$v.pkg"

      - name: Release notes
        run: |
          set -eu
          v='${{ steps.ver.outputs.version }}'
          # Notes are optional per release; the shared helper guarantees a non-empty body, generating
          # a default when release-notes/<TAG>.md is absent (shipyard has no committed notes, and with
          # a release per push it should not grow them for routine changes).
          #
          # It prints a PATH, not the content. Redirecting its stdout into the notes file would give
          # the Release a body consisting of a temp-file path -- non-empty, so release-assets.sh would
          # pass it, and the defect would only be visible on github.com.
          notes_path="$(MAVERICKS_ROOT="$PWD" sh scripts/release-notes-file.sh "v$v" "$v" "Mavericks Shipyard")"
          cp "$notes_path" dist/RELEASE_NOTES.md
          [ -s dist/RELEASE_NOTES.md ] || { echo "::error::release notes came back empty"; exit 1; }

      - name: Sign + appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}   # sign_and_appcast.sh fetches ed25519-sign via gh
        run: |
          set -eu
          v='${{ steps.ver.outputs.version }}'
          # The same notes the Release body gets, so Sparkle and the Release page tell one story.
          sh scripts/sign_and_appcast.sh \
            --channel-title "Mavericks Shipyard" \
            --version "$v" \
            --pkg-url "https://github.com/ModernMavericks/shipyard/releases/download/v$v/mavericks-shipyard-$v.pkg" \
            --notes-file dist/RELEASE_NOTES.md \
            --pkg "dist/mavericks-shipyard-$v.pkg" \
            > dist/appcast.xml
          # A client on the previous release must SEE this one as an upgrade. shipyard tags vX.Y.Z,
          # which the gate's default -mavericks.N scope cannot see -- without --tag-glob it would find
          # no previous release and skip the ordering check on every release. 'v*.*.*' also keeps the
          # moving major tag (v1) out of it.
          sh scripts/assert_appcast_upgradeable.sh --appcast dist/appcast.xml --version "v$v" --tag-glob 'v*.*.*'

      # Do the artifacts about to be published agree with each other and with the family's schemes?
      # Where shipyard legitimately departs from them, INGREDIENTS.md says so and why.
      - name: Artifact conformance
        run: |
          set -eu
          v='${{ steps.ver.outputs.version }}'
          sh scripts/artifact-facts.sh dist "$v" | sh scripts/check-artifact-conformance.sh
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: shipyard-dist
          path: dist

  # Local `uses:` path -> THIS commit's publish workflow, and shipyard-ref pins the inner checkout of
  # release-assets.sh to the same commit. Publishing with @v1 would ship a version using the previous
  # version's tooling, unable to catch a defect in the tooling being shipped.
  publish:
    needs: build
    permissions:
      contents: write
    uses: ./.github/workflows/publish-release.yml
    with:
      version: v${{ needs.build.outputs.version }}
      artifact: shipyard-dist
      shipyard-ref: ${{ github.sha }}

  # Consumers pin @v1 (moving) or @vX.Y.Z (exact). Moved only after publish succeeds, so @v1 never
  # points at a version that failed to release.
  major-tag:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Move the major tag
        run: |
          set -eu
          major="v${{ needs.build.outputs.version }}"; major="${major%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a "$major" -m "$major -> v${{ needs.build.outputs.version }}"
          git push -f origin "$major"
          echo "moved $major -> $(git rev-parse --short HEAD)"
