name: CI

# shipyard had no CI at all: the repo that tells the family "tests that exist must run" ran none of
# its own. That matters more here than anywhere else — these scripts reach all seven product repos
# through the moving @v1 tag, so a break here ships everywhere before anyone notices.
#
# Two invocations because there are two kinds of test:
#   - ctest drives the parameterized ones (add_test passes each a source/config dir)
#   - run-repo-tests.sh takes the standalone tests/*-test.sh and *.bats suites
# The overlap is harmless: the ctest-owned scripts exit 77 (SKIP) when called without their argument.

on:
  push:
    branches-ignore: [main]   # main belongs to release.yml, which runs this same suite before it
                              # publishes. Two workflows running it on main meant "the repo is red"
                              # and "we published" were decided independently: ci.yml failed on four
                              # consecutive commits while release.yml shipped v1.0.126 through .131
                              # from those very trees.
  pull_request:
    branches: [main]          # the `test` job here is main's required status check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26   # the CMake modules gate on Apple clang; Linux cannot exercise them
    timeout-minutes: 90     # source-build mode builds CMake twice on a cache miss
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0      # shipyard-version.sh derives the patch from the commit count and
                              # REFUSES a shallow clone rather than silently returning 1.0.1. Without
                              # this the failure lands far from its cause: "installed package says
                              # '1.0', derived version is ''", in a cmake test, nowhere near here.

      # Installs shipyard (this repo) in source-build mode — the cached universal CMake tree plus this
      # checkout, in the prefix shape the pkg lays down — and, incidentally, bats, which is what makes
      # the *.bats suites below actually run instead of reporting SKIP. Source-build because shipyard
      # cannot install a RELEASED shipyard to test the commit that is about to become one; every
      # configure below therefore goes through shipyard-cmake, exactly as a consumer's must.
      #
      # The tree is built here and passed in: install@v1 must contain no `uses: ./...` of its own, or
      # every consumer breaks on a path only shipyard's workspace has (R-P1-19).
      - id: cm
        uses: ./.github/actions/shipyard-cmake
      - name: Install mavericks-shipyard (self, source-build)
        uses: ./.github/actions/install
        with:
          source: build
          cmake-tree: ${{ steps.cm.outputs.tree }}

      # The workflow-parse gate (check-family-conventions.sh check 8) needs PyYAML, and the macOS
      # runner's python3 has none -- which is what reddened every run here for a month. It is
      # provisioned in THIS job rather than in .github/actions/install because the need is local to
      # shipyard: consumers reach that gate through family-conventions.yml, which runs on
      # ubuntu-latest, whose python3 already has PyYAML. Putting it in the install action would have
      # run a pip install in all seven consumers' release jobs to fix a problem none of them have.
      # setup-python (not the system python3) so pip is not PEP 668 externally-managed; safe here
      # because this job is ours -- inside the composite install action it would have prepended a
      # Python to PATH for every later step in a CONSUMER's job.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Provision PyYAML (the workflow-parse gate's only dependency)
        run: python3 -m pip install --quiet pyyaml && python3 -c 'import yaml; print("PyYAML", yaml.__version__)'

      - name: ctest (parameterized suites)
        run: |
          shipyard-cmake -S . -B build
          shipyard-ctest --test-dir build --output-on-failure

      - name: Standalone test suites
        run: sh scripts/run-repo-tests.sh

  # Builds (or restores) the universal shipyard-cmake, publishes it as a run artifact so it can be run
  # on a real 10.9 box (the only proof the x86_64 slice actually works there) -- and then REHEARSES the
  # whole release packaging path on it.
  #
  # The rehearsal is why this job is not just an artifact job (R-P1-17). release.yml runs only on a
  # push to main, so the packaging and install-smoke steps below would otherwise first execute during
  # the flag-day push -- the one push that must not be a rehearsal. Here they run on every branch
  # push, against a real pkg installed on a real runner, and assert the result with the SAME
  # scripts/assert-installed-shipyard.sh release.yml's smoke calls.
  shipyard-cmake:
    runs-on: macos-26
    timeout-minutes: 90     # a cache miss builds CMake twice
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0      # blanket repo convention (shipyard-workflow-coupling-test.sh): every
                              # checkout in ci.yml/release.yml must be full-depth, so shipyard-version.sh
                              # never meets a shallow clone no matter which job runs it later.
      # Built here, passed in: install@v1 must contain no `uses: ./...` of its own (R-P1-19).
      - id: cm
        uses: ./.github/actions/shipyard-cmake
      - name: Install mavericks-shipyard (self, source-build)
        uses: ./.github/actions/install
        with:
          source: build
          cmake-tree: ${{ steps.cm.outputs.tree }}

      # $SHIPYARD_CMAKE_TREE, never the prefix install@v1 assembled: that prefix has shipyard installed
      # into it, and this artifact is meant to be the bare CMake tree a 10.9 box can unpack and run.
      - name: Pack the tree
        run: tar -czf "$RUNNER_TEMP/shipyard-cmake-tree.tar.gz" -C "$SHIPYARD_CMAKE_TREE" .
      - uses: actions/upload-artifact@v7
        with:
          name: shipyard-cmake-tree
          path: ${{ runner.temp }}/shipyard-cmake-tree.tar.gz

      # The same two-arch build and merge release.yml does. A deployment floor is per-configure and
      # arm64 has no 10.9, so the updater is built once per arch and merged; Info.plist differs by the
      # floor, declared.
      - name: Build the universal updater
        run: |
          set -eu
          for a in "x86_64 10.9" "arm64 11.0"; do
            set -- $a
            shipyard-cmake -S . -B "$RUNNER_TEMP/upd-$1" -DSHIPYARD_BUILD_UPDATER=ON \
              -DMAVERICKS_ALLOW_GENERIC_ICON=ON -DCMAKE_OBJC_COMPILER=/usr/bin/clang \
              -DCMAKE_OSX_ARCHITECTURES="$1" -DCMAKE_OSX_DEPLOYMENT_TARGET="$2"
            shipyard-cmake --build "$RUNNER_TEMP/upd-$1"
          done
          sh scripts/lipo-merge-tree.sh \
            --a "$RUNNER_TEMP/upd-x86_64/MavericksShipyardUpdater.app" \
            --b "$RUNNER_TEMP/upd-arm64/MavericksShipyardUpdater.app" \
            --out "$RUNNER_TEMP/MavericksShipyardUpdater.app" \
            --allow-differ Contents/Info.plist --require-archs "x86_64 arm64"
          # NOT re-signed: see the long note on the same step in release.yml (R-P1-22). lipo preserves
          # each slice verbatim, including the ad-hoc signature ld gives the arm64 one, and nothing in
          # shipyard's build seals this bundle, so there is nothing to re-seal -- while `--deep` would
          # replace Sparkle's own signature and then fail to verify a versioned framework.
          exe="$RUNNER_TEMP/MavericksShipyardUpdater.app/Contents/MacOS/MavericksShipyardUpdater"
          archs="$(lipo -info "$exe" | sed -n 's/.*: //p')"
          case " $archs " in *" x86_64 "*) ;; *) echo "::error::the merged updater has no x86_64 slice: $archs"; exit 1;; esac
          case " $archs " in *" arm64 "*) ;; *) echo "::error::the merged updater has no arm64 slice: $archs"; exit 1;; esac
          echo "merged updater: $archs"

      - name: Package
        run: |
          set -eu
          v="$(sh scripts/shipyard-version.sh | sed -n 's/^FULL=//p')"
          echo "rehearsing the pkg for $v"
          mkdir -p "$RUNNER_TEMP/dist"
          shipyard-cmake -S . -B "$RUNNER_TEMP/payload-build"
          shipyard-cmake --install "$RUNNER_TEMP/payload-build" --prefix "$RUNNER_TEMP/payload-prefix"
          sh scripts/package-pkg.sh \
            --cmake-tree "$SHIPYARD_CMAKE_TREE" \
            --shipyard-prefix "$RUNNER_TEMP/payload-prefix" \
            --app "$RUNNER_TEMP/MavericksShipyardUpdater.app" \
            --version "$v" \
            --out "$RUNNER_TEMP/dist/mavericks-shipyard-$v.pkg"
          sh scripts/assert_pkg_installs_in_place.sh "$RUNNER_TEMP/dist/mavericks-shipyard-$v.pkg"

      # Nothing is published from a branch push, so this installs the pkg purely to find out what it
      # DOES -- on the same kind of runner release.yml will use, with the same assertions.
      - name: Install smoke (the rehearsed pkg)
        timeout-minutes: 10
        run: |
          set -eu
          bad=0
          sudo installer -pkg "$RUNNER_TEMP"/dist/mavericks-shipyard-*.pkg -target / || bad=1
          want="$(sed -n 's/^CMAKE_VERSION=//p' cmake.pin)"
          sh scripts/assert-installed-shipyard.sh --cmake-version "$want" --root / || bad=1
          if [ "$bad" -ne 0 ]; then
            echo "---- /var/log/install.log, the pkg's scripts ----"
            sudo grep -E 'preinstall|postinstall|mavericks-shipyard' /var/log/install.log | tail -n 100 || true
          fi
          [ "$bad" -eq 0 ] || exit 1
