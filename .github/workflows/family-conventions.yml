name: family-conventions

# Reusable: the family conventions gate. A consumer adds a three-line caller job and gets every check
# in scripts/check-family-conventions.sh, including ones added later -- the caller never changes.
#
# It checks out shipyard itself rather than expecting $SHIPYARD_SCRIPTS, so it works in repos that do
# not consume shipyard's CMake side at all (swift-toolchain builds and mirrors; it has no install
# step, no updater, no .pkg). A gate only some repos can run is not a family convention.

on:
  workflow_call:
    inputs:
      shipyard-ref:
        description: "shipyard ref to take the gate from. Default v1 (the moving major tag)."
        type: string
        required: false
        default: v1

jobs:
  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out shipyard (for the gate script)
        uses: actions/checkout@v7
        with:
          repository: ModernMavericks/shipyard
          ref: ${{ inputs.shipyard-ref }}
          path: .shipyard

      - name: Family conventions gate
        run: sh .shipyard/scripts/check-family-conventions.sh
